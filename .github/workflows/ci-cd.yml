name: CI y migraciones de producción

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, feat/PDGLD-104-excepciones-edad]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Aplicar las migraciones revisadas de main a Supabase producción"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  app:
    name: Aplicación
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ci-app-${{ github.ref }}
      cancel-in-progress: true
    env:
      DATABASE_URL: postgresql://postgres:ci_ephemeral_password@127.0.0.1:5432/gestor_ligas_ci
      DIRECT_URL: postgresql://postgres:ci_ephemeral_password@127.0.0.1:5432/gestor_ligas_ci
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-never-use-in-production
      MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - name: Instalar las dependencias del lockfile
        run: npm ci
      - name: Comprobar la integridad de las migraciones
        run: npm run ci:guard-migrations
      - name: Probar los controles del pipeline
        run: npm run test:standings && npm run test:ci && npm run test:database-config && npm run test:account-form && npm run test:account-maintenance && npm run test:email-transport && npm run test:password-recovery && npm run test:account-maintenance-ui && npm run test:email-confirmation && npm run test:affiliation-input && npm run test:affiliation-review && npm run test:club-maintenance-input
      - name: Probar horarios de canchas y zonas horarias (PDGLD-22)
        run: node --import tsx --test src/features/venues/time.test.ts src/features/venues/home-venue.test.ts src/features/scheduling/stored-proposal.test.ts
      - name: Probar generación de calendario y restricciones (PDGLD-135)
        run: npm run test:scheduling
      - name: Probar contratos y reglas de transiciones (PDGLD-132)
        run: npm run test:match-transitions
      - name: Probar interfaz de inscripción y actividad de sesión sin base
        run: npm run test:team-registration
      - name: Probar inscripción en Chrome con datos sintéticos
        timeout-minutes: 2
        run: npm run test:browser-harness && npm run test:team-registration-browser && npm run test:ine-browser
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Probar controles de competencias en Chrome con datos sintéticos
        run: npm run test:competition-ui
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Probar ajustes y revisión de propuestas en Chrome (PDGLD-139)
        run: node --test tests/e2e/scheduling-proposals.test.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Probar firmas de afiliación
        run: npm run test:signatures
      - name: Probar revisión y reenvío de afiliación en Chrome
        run: npm run test:affiliation-journey
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Probar captura y vista previa de firmas con datos sintéticos
        timeout-minutes: 2
        run: npm run test:direct-signature && npm run test:signature-preview && npm run test:guardian-signature && npm run test:player-workspace && npm run test:age-exception-browser
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Probar validación local de identidad de jugadores
        run: npm run test:player-admission && npm run test:age-exception && npm run test:player-identity && npm run test:curp-provider && npm run test:ine-provider && npm run test:player-dossier && npm run test:player-document-storage
      - name: Probar recuperación de inscripciones y capacidades del cliente
        run: npm run test:team-enrollment-client
      - name: Probar elegibilidad por partido en PostgreSQL aislado y Chrome sintético
        run: npm run test:match-eligibility-integration && npm run test:match-eligibility-browser
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Clasificación sintética en PostgreSQL 15 y 17
        run: npm run test:standings-integration && npm run test:standings-integration -- --postgres=17
      - name: Clasificación interna con el rol limitado de Preview en Chrome (PDGLD-151)
        timeout-minutes: 5
        run: npm run test:standings-workspace
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Confirmación y clasificación transaccional con dependencias sintéticas (PDGLD-152)
        run: npm run test:standings-confirmation && npm run test:standings-confirmation -- --postgres=17
      - name: Revisar el código
        run: npm run lint
      - name: Compilar la aplicación
        run: npm run build

  database:
    name: Migraciones PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "17"]
    concurrency:
      group: ci-database-${{ matrix.postgres }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      DATABASE_URL: postgresql://postgres:ci_ephemeral_password@127.0.0.1:5432/gestor_ligas_ci
      DIRECT_URL: postgresql://postgres:ci_ephemeral_password@127.0.0.1:5432/gestor_ligas_ci
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_password
          POSTGRES_DB: gestor_ligas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestor_ligas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Descargar el código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - name: Instalar las dependencias del lockfile
        run: npm ci
      - name: Validar el esquema de Prisma
        run: npx --no-install prisma validate
      - name: Reconstruir una base temporal desde las migraciones
        run: npx --no-install prisma migrate deploy
      - name: Verificar que el esquema tenga su migración
        run: npx --no-install prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Verificar los objetos e integridad de la base
        run: node scripts/ci/verify-database.mjs
      - name: Probar aislamiento de producción sin modificar el entorno local
        run: node scripts/ci/verify-production-security.mjs
      - name: Probar autenticación, autorización y cuentas con base temporal local
        run: npm run test:auth
      - name: Probar inscripción de equipos, alcance y concurrencia
        run: npm run test:team-enrollments
      - name: Probar identidad, inscripción única y permisos de jugadores
        run: npm run test:player-registrations && npm run test:player-participations
      - name: Probar temporadas, alcance, auditoría y concurrencia
        run: npm run test:competitions
      - name: Probar generación con PostgreSQL aislado y permisos limitados
        run: npm run test:scheduling:integration
      - name: Probar Preview con rol limitado, RLS, afiliaciones y operaciones por HTTP
        run: npm run test:preview-runtime
      - name: Probar competencias, distribución y mantenimiento con rol Preview y RLS
        run: npm run test:preview-competitions
      - name: Probar sesión HTTP y transiciones con rol limitado de Preview
        run: npm run test:match-transitions-preview
      - name: Probar recuperación de contraseña con PostgreSQL y RLS
        run: npm run test:password-recovery-integration
      - name: Probar catálogo disciplinario, permisos e historial (PDGLD-26)
        run: |
          node --import tsx --test src/features/discipline/contract.test.ts
          node scripts/test-auth.mjs --preview-catalog
      - name: Probar seed, integridad, rollback e idempotencia
        run: npm run test:seed -- --existing
      - name: Probar disponibilidad, reservas concurrentes y bloqueos (PDGLD-22)
        env:
          PDGLD22_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: node --test tests/integration/venue-availability.test.mjs
      - name: Probar transiciones, permisos, reintentos y rollback (PDGLD-132)
        env:
          PDGLD132_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run test:match-transitions-db
      - name: Probar órganos, nombramientos, historial y permisos (PDGLD-37)
        run: |
          node --conditions=react-server --import tsx prisma/seed.ts --profile permissions
          node --conditions=react-server --import tsx --test tests/integration/league-governance.test.ts
      - name: Probar préstamos privados, decisiones y localías (PDGLD-23)
        run: node --conditions=react-server --import tsx --test tests/integration/venue-loans.test.ts
      - name: Probar ajuste de borrador, auditoría y concurrencia (PDGLD-138)
        run: node --conditions=react-server --import tsx --test tests/integration/schedule-adjustment.test.ts

  refereeing:
    name: Arbitraje real PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:ci_ephemeral_password@127.0.0.1:5432/gestor_ligas_ci
      DIRECT_URL: postgresql://postgres:ci_ephemeral_password@127.0.0.1:5432/gestor_ligas_ci
    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 17]
    steps:
      - name: Descargar el código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - name: Instalar las dependencias del lockfile
        run: npm ci
      - name: Probar componentes con datos sintéticos
        run: npm run test:referees:components
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Probar sesión, PostgreSQL, RLS Preview, HTTP y Chrome reales
        run: npm run test:referees:integration -- --postgres=${{ matrix.postgres }}
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Probar carreras entre cierre e identidad histórica
        run: npm run test:season-identity-history

  match-reports:
    name: Cédula implementada PG${{ matrix.postgres }} (aceptación bloqueada)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 17]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Pruebas de cédula, Chrome real y bloqueo de efectos pendientes
        run: npm run test:pdgld149 -- --postgres=${{ matrix.postgres }}
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Regresiones de elegibilidad, designaciones, historial y firmas
        run: npm run test:pdgld149 -- --regression --postgres=${{ matrix.postgres }}
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: PDGLD-19 y PDGLD-20 con almacenamiento y transporte reales
        run: npm run test:match-report-offline -- --postgres=${{ matrix.postgres }}
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Conservar criterios offline sin datos de captura
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pdgld19-20-pg${{ matrix.postgres }}
          path: .codex-attachments/pdgld19-20/pg${{ matrix.postgres }}/*.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Conservar evidencia y bloqueos incluso ante fallo
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdgld149-pg${{ matrix.postgres }}
          path: .codex-attachments/pdgld149/
          include-hidden-files: true
          if-no-files-found: error

  checks:
    name: CI listo para integrar
    if: ${{ always() }}
    needs: [app, database, refereeing, match-reports]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      APP_RESULT: ${{ needs.app.result }}
      DATABASE_RESULT: ${{ needs.database.result }}
      REFEREEING_RESULT: ${{ needs.refereeing.result }}
      MATCH_REPORTS_RESULT: ${{ needs.match-reports.result }}
    steps:
      - name: Exigir que todas las comprobaciones pasen
        run: |
          test "$APP_RESULT" = "success"
          test "$DATABASE_RESULT" = "success"
          test "$REFEREEING_RESULT" = "success"
          test "$MATCH_REPORTS_RESULT" = "success"

  deploy:
    name: Migraciones Supabase producción
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: supabase-production
    concurrency:
      group: supabase-production-migrations
      cancel-in-progress: false
    steps:
      - name: Descargar el código revisado de main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - name: Instalar las dependencias del lockfile
        run: npm ci
      - name: Verificar y aplicar las migraciones de producción
        run: node scripts/ci/deploy-supabase.mjs
        env:
          SUPABASE_MIGRATION_URL: ${{ secrets.SUPABASE_MIGRATION_URL }}
          SUPABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
